name: "02 - OpenTimestamps Bitcoin Upgrade"

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ots-timestamps
  cancel-in-progress: false

jobs:
  upgrade:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install OpenTimestamps client
        run: pip install --quiet opentimestamps-client

      - name: Upgrade pending .ots proofs against Bitcoin
        run: |
          set -euo pipefail
          mkdir -p audit-log
          CHECKED=0

          while IFS= read -r -d '' ots_file; do
            if ots info "$ots_file" | grep -q "PendingAttestation"; then
              echo "Attempting Bitcoin upgrade for: $ots_file"
              ots upgrade "$ots_file" || true
              rm -f "${ots_file}.bak"
              CHECKED=$((CHECKED + 1))
            fi
          done < <(find audit-log -type f -name "*.ots" -print0 | sort -z)

          echo "Checked $CHECKED proof(s) with pending calendar attestations."

      - name: Commit and push upgraded proofs
        run: |
          set -euo pipefail
          if [ -z "$(git status --porcelain audit-log/)" ]; then
            echo "No newly confirmed Bitcoin proofs to commit yet."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add audit-log/
          git commit -m "[OTS-Auto] Upgrade OpenTimestamps proof(s) with Bitcoin block attestation [skip ci]"
          git pull --rebase origin main
          git push origin main
